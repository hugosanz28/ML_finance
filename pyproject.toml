[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-finance"
version = "0.1.0"
description = "Local portfolio analytics, DEGIRO import, reporting, and agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair==6.0.0",
    "duckdb==1.5.1",
    "openai==2.32.0",
    "pandas==3.0.2",
    "pyarrow==23.0.1",
    "python-dotenv==1.2.2",
    "streamlit==1.56.0",
    "yfinance==1.5.2",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "detect-secrets==1.5.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]
notebooks = [
    "jupyter==1.1.1",
    "matplotlib==3.10.8",
    "networkx==3.6.1",
    "numpy==2.4.4",
    "openpyxl==3.1.5",
    "python-louvain==0.16",
    "scikit-learn==1.8.0",
    "tqdm==4.67.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = [
    "agents/prompts/*.md",
    "data/sql/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/portfolio/dashboard.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "demo/local_data",
    "src/data/local",
    "src/degiro_exports/local",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# These executable entrypoints add the repository root before importing `src`.
"scripts/*.py" = ["E402"]
"src/portfolio/dashboard.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/agents/autonomy.py",
    "src/agents/models.py",
    "src/application/types.py",
    "src/config.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
