[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-finance"
version = "0.1.0"
description = "Local portfolio analytics, DEGIRO import, reporting, and agent workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "altair==6.0.0",
    "duckdb==1.5.1",
    "jupyter==1.1.1",
    "matplotlib==3.10.8",
    "networkx==3.6.1",
    "numpy==2.4.4",
    "openai==2.32.0",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "pyarrow==23.0.1",
    "pytest==9.0.2",
    "python-dotenv==1.2.2",
    "python-louvain==0.16",
    "scikit-learn==1.8.0",
    "streamlit==1.56.0",
    "tqdm==4.67.3",
    "yfinance==1.2.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
